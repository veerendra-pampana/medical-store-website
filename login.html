<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - MediStore Manager</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card">
        <div class="login-brand">
          <div class="brand-mark">M</div>
          <div>
            <h1>Sri Krishna Medicals</h1>
            <p>Medical Store Manager</p>
          </div>
        </div>

        <h2>Sign in</h2>
        <p class="login-sub">Authorized staff only.</p>

        <form class="login-form" id="loginForm">
          <label>
            Username
            <input id="loginUsername" required autocomplete="username" placeholder="admin" />
          </label>
          <label>
            Password
            <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="********" />
          </label>
          <button class="primary-button full-width" type="submit">Sign In</button>
          <p class="login-error" id="loginError"></p>
        </form>
      </section>
    </main>
    <script src="login.js"></script>
  </body>
</html>
